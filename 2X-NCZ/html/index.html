<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="nui://game/ui/jquery.js"></script>
    <script src="listener.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="stilius.css">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        @keyframes slideUp {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes slideDown {
            0% { transform: translateY(0px); opacity: 1; }
            100% { transform: translateY(20px); opacity: 0; }
        }
        .animate-slideup { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .animate-slidedown { animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="h-screen flex flex-col-reverse w-fit p-2 hidden overflow-hidden">
    <div class="flex items-center gap-2 rounded-lg border p-1 border-white/10 text-white text-xs bg-black/50 relative overflow-hidden animate-slideup">
        <div class="flex items-center justify-center w-5 h-5 rounded-md bg-red-500/15">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="w-3.5 h-3.5 text-[#FF3B30]">
                <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>
        <div class="flex flex-col">
            <div class="font-semibold text-white/95">
                NCZ: Šioje zonoje CRIME griežtai draudžiamas
            </div>
        </div>
    </div>
</body>
</html>
