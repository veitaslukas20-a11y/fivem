<!DOCTYPE html>
<html lang="lt">

<head>
    <link rel="stylesheet" href="style.css">
    <title>Deivuks Garage v2</title>
    <script src="https://kit.fontawesome.com/2a806e65da.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="./dist/ZlataLoader.js"></script>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
</head>

<body>

    <div class="main" id="main">
        <div class="menu">
            <a class="title" id="title"></a>
            <div class="info">
                <button class="box">
                    <i class="fa-solid fa-location-arrow center"></i>
                </button>
                <a class="address" id="address">
                </a>
            </div>

            <div class="garage">
                <a class="name" id="vehicles_title"></a>
                <div class="meniu" id="vehicle">
                </div>
            </div>
            <div class="search">
                <button class="icon"><i class="fa-solid fa-magnifying-glass"></i></button> 
                <input class="bar" type="text" placeholder="" oninput="checkValue()" id="search"><br>
            </div>
            <i class="fa-solid fa-palette color" onclick="color_picker()" id="color"></i>
            <i class="fa-solid fa-rotate-right" id="reset" onclick="reset_color()"></i>
            <input id="color_picker" type="color" value="#001753">
        </div>
        <div class="enter">
            <img src="./images/enter.png"> <a class="takeout" id="takeout"></a>
        </div>
        <div class="status">
            <a class="name" id="status_name"></a><br><br>
            <a class="subname" id="status_engine"></a><a class="precent" id="epercent">80%</a>
            <div class="progress"><div id="engine"></div></div><br>
            <a class="subname" id="status_body"></a><a class="precent" id="bpercent">80%</a>
            <div class="progress"><div id="body"></div></div><br>
            <a class="subname" id="status_tank"></a><a class="precent" id="tpercent">80%</a>
            <div class="progress"><div id="fueltank"></div></div><br>
            <a class="subname" id="status_fuel"></a><a class="precent" id="fpercent">80L</a>
            <div class="progress"><div id="fuel"></div></div>
        </div>
        <div class="escape">
            <img src="./images/esc.png"> <a class="exit" id="exit"></a>
        </div>
    </div>

    <div id="loader"></div>

    <script src="./dist/ZlataLoader.js"></script>
    <script src="script.js"></script>
</body>

</html>
